services:
  postgres:
    image: postgres:16
    container_name: fin-postgres
    # The Airflow stack next door already restarts always; this one did not,
    # and the asymmetry is what broke the 2026-09-05 run: Docker Desktop came
    # up, every Airflow container came back on its own, and the ETL ran on
    # schedule against a database that was still stopped. "unless-stopped"
    # rather than "always" so a deliberate `docker stop` stays stopped.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fin_dw}
      POSTGRES_USER: ${POSTGRES_USER:-fin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/ddl_star_schema.sql:/docker-entrypoint-initdb.d/001_ddl_star_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fin} -d ${POSTGRES_DB:-fin_dw}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: fin-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin-data:
